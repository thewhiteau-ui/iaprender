<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IAPRENDER — Inteligência Artificial na Educação</title>
  <meta name="description" content="Guia prático e interativo de como professores, estudantes e coordenadores podem usar a Inteligência Artificial de forma ética e eficiente na escola." />
  <style>
    :root {
      --primary: #4338ca;
      --primary-dark: #312e81;
      --primary-light: #eef2ff;
      --accent: #0d9488;
      --accent-light: #f0fdfa;
      --amber: #d97706;
      --amber-light: #fffbeb;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --text-muted: #475569;
      --border: #e2e8f0;
      --radius: 14px;
      --shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.07), 0 4px 10px -4px rgba(15, 23, 42, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .container {
      width: 100%;
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Header / Navbar */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }

    .nav-wrapper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 70px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.5px;
    }

    .logo-badge {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-size: 1.1rem;
    }

    .nav-links {
      display: flex;
      gap: 26px;
      align-items: center;
      font-weight: 500;
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .nav-links a:hover {
      color: var(--primary);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 22px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .btn-outline {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-outline:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .mobile-toggle {
      display: none;
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 1.1rem;
      cursor: pointer;
    }

    /* Hero Section */
    .hero {
      padding: 72px 0 64px;
      background: radial-gradient(circle at top right, #e0e7ff 0%, transparent 45%),
                  radial-gradient(circle at bottom left, #ccfbf1 0%, transparent 40%);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 44px;
      align-items: center;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--primary-light);
      color: var(--primary);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 18px;
    }

    .hero h1 {
      font-size: clamp(2.1rem, 4vw, 3.1rem);
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 18px;
    }

    .hero h1 span {
      color: var(--primary);
    }

    .hero p {
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-bottom: 28px;
      max-width: 580px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .hero-cards {
      display: grid;
      gap: 16px;
    }

    .mini-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }

    .mini-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 1.3rem;
      flex-shrink: 0;
    }

    .mini-card h3 {
      font-size: 1.05rem;
      margin-bottom: 4px;
    }

    .mini-card p {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin: 0;
    }

    /* Sections */
    section {
      padding: 68px 0;
    }

    .section-header {
      text-align: center;
      max-width: 680px;
      margin: 0 auto 44px;
    }

    .section-header h2 {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 12px;
      letter-spacing: -0.01em;
    }

    .section-header p {
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    /* Role Tabs */
    .tabs {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 34px;
    }

    .tab-btn {
      padding: 12px 24px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 6px 16px rgba(67, 56, 202, 0.
